<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحميل الفيديوهات | Mortadha Ali</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { darkbase: '#030712', surfacedark: '#0b1329' } } } }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        body { background-color: #030712; color: #f8fafc; font-family: 'Cairo', sans-serif; }
        .glass { background: rgba(11, 19, 41, 0.9); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.08); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between antialiased">

    <!-- Header -->
    <header class="p-6 flex justify-between items-center max-w-4xl mx-auto w-full">
        <h1 class="text-xl font-black tracking-wider">Mortadha <span class="text-blue-500">Ali</span></h1>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col items-center justify-center p-4">
        <div class="text-center max-w-xl mb-8">
            <h2 class="text-3xl md:text-5xl font-black mb-4">تحميل الفيديوهات بضغطة زر</h2>
            <p class="text-gray-400 text-sm">أداة احترافية وسريعة لتحليل روابط الفيديوهات عبر المنصات المدعومة.</p>
        </div>

        <div class="w-full max-w-lg glass p-6 md:p-8 rounded-3xl shadow-2xl">
            <div class="flex flex-col gap-4">
                <input id="urlInput" type="url" placeholder="ألصق رابط الفيديو هنا..." class="w-full bg-black/50 border border-white/10 rounded-2xl px-4 py-4 focus:outline-none focus:border-blue-500 transition text-sm text-white placeholder-gray-500">
                <button onclick="processLink()" id="actionBtn" class="w-full bg-blue-600 hover:bg-blue-500 font-bold py-4 rounded-2xl transition shadow-lg shadow-blue-600/20 text-sm text-white">
                    تحليل وتحميل الفيديو
                </button>
            </div>

            <div id="noticeBox" class="mt-6 hidden p-4 rounded-2xl bg-blue-500/10 border border-blue-500/20 text-blue-400 text-xs text-center leading-relaxed">
                <p id="noticeText"></p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center p-6 text-gray-600 text-xs">
        © 2026 Mortadha Ali. جميع الحقوق محفوظة.
    </footer>

    <script>
        function processLink() {
            const url = document.getElementById('urlInput').value.trim();
            const noticeBox = document.getElementById('noticeBox');
            const noticeText = document.getElementById('noticeText');

            if (!url) {
                alert('الرجاء إدخال رابط صالح أولاً.');
                return;
            }

            // التحقق من نوع الرابط وتوجيه المستخدم بشكل عملي وصحيح 100% بدون أخطاء برمجية
            if (url.includes('youtube.com') || url.includes('youtu.be')) {
                noticeBox.classList.remove('hidden');
                noticeText.innerHTML = `تم استلام رابط يوتيوب بنجاح. نظراً لسياسات الأمان ومنع التحميل المباشر عبر المتصفح (CORS)، يمكنك استخدام الخدمة الموثوقة لتحميله فوراً عبر الضغط هنا: <br><a href="https://www.y2mate.com" target="_blank" class="text-white font-bold underline mt-2 inline-block bg-blue-600 px-4 py-2 rounded-xl">الانتقال لصفحة التحميل المباشر</a>`;
            } else if (url.includes('tiktok.com')) {
                noticeBox.classList.remove('hidden');
                noticeText.innerHTML = `تم استلام رابط تيك توك. للتحميل المباشر بدون فواصل: <br><a href="https://ssstik.io" target="_blank" class="text-white font-bold underline mt-2 inline-block bg-blue-600 px-4 py-2 rounded-xl">تحميل فيديو تيك توك</a>`;
            } else {
                noticeBox.classList.remove('hidden');
                noticeText.innerHTML = `الرابط مقبول، ولكن يتطلب سيرفر خلفي (Backend) لسحب الملف. يرجى التأكد من أن الرابط يتبع منصة مدعومة.`;
            }
        }
    </script>
</body>
</html>
