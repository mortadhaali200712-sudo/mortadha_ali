<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحميل الفيديو الفوري | Mortadha Ali</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        body { background-color: #030712; color: #f8fafc; font-family: 'Cairo', sans-serif; }
        .glass { background: rgba(11, 19, 41, 0.9); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between items-center p-4">

    <!-- Header -->
    <header class="p-6 text-center w-full">
        <h1 class="text-2xl font-black">Mortadha <span class="text-blue-500">Ali</span></h1>
    </header>

    <!-- Main Container -->
    <main class="w-full max-w-md glass p-6 rounded-3xl shadow-2xl flex flex-col gap-5">
        <div class="text-center">
            <h2 class="text-xl font-bold mb-2">تحميل الفيديوهات بضغطة زر</h2>
            <p class="text-gray-400 text-xs">ألصق الرابط لتظهر الصورة المصغرة ويتم التحميل المباشر.</p>
        </div>

        <!-- Input Section -->
        <div class="flex flex-col gap-3">
            <input id="urlInput" type="url" placeholder="ضع رابط الفيديو هنا..." class="w-full bg-black/50 border border-white/10 rounded-xl px-4 py-3.5 focus:outline-none focus:border-blue-500 text-sm text-white">
            <button onclick="fetchVideoData()" id="fetchBtn" class="w-full bg-blue-600 hover:bg-blue-500 font-bold py-3.5 rounded-xl transition text-sm shadow-lg shadow-blue-600/30">
                جلب الصورة المصغرة وتحميل
            </button>
        </div>

        <!-- Status Message -->
        <div id="statusMsg" class="text-xs text-center text-blue-400 hidden p-2 bg-blue-500/10 rounded-lg"></div>

        <!-- Result Section (الصورة المصغرة وزر التحميل الفعلي) -->
        <div id="resultSection" class="hidden flex-col gap-4 border-t border-white/10 pt-4">
            <div class="w-full aspect-video rounded-xl overflow-hidden bg-black shadow">
                <img id="thumbnailImg" src="" alt="صورة الفيديو المصغرة" class="w-full h-full object-cover">
            </div>
            <h3 id="videoTitle" class="font-bold text-xs text-center line-clamp-2 text-gray-200"></h3>
            
            <!-- زر التحميل المباشر على الجهاز -->
            <a id="downloadLink" href="#" target="_blank" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 rounded-xl text-center text-sm transition shadow-lg shadow-emerald-600/30 block">
                تحميل الفيديو على الجهاز الآن
            </a>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center p-4 text-gray-600 text-xs">
        © 2026 Mortadha Ali. جميع الحقوق محفوظة.
    </footer>

    <script>
        async function fetchVideoData() {
            const url = document.getElementById('urlInput').value.trim();
            const statusMsg = document.getElementById('statusMsg');
            const resultSection = document.getElementById('resultSection');
            const fetchBtn = document.getElementById('fetchBtn');

            if (!url) {
                alert('الرجاء إدخال رابط الفيديو أولاً!');
                return;
            }

            // تفعيل حالة التحميل المؤقتة
            fetchBtn.disabled = true;
            fetchBtn.textContent = "جاري جلب المعلومات...";
            statusMsg.classList.remove('hidden');
            statusMsg.textContent = "جاري الاتصال واستخراج الصورة المصغرة...";
            resultSection.classList.add('hidden');

            try {
                // استخدام خدمة ربط موثوقة تستخرج البيانات وتتجاوز القيود
                const response = await fetch(`https://co.wukko.me/api/json`, {
                    method: 'POST',
                    headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url, vQuality: '720' })
                });

                const data = await response.json();

                if (data.status === 'error' || (!data.url && !data.picker)) {
                    throw new Error('تعذر جلب الفيديو، تأكد من صحة الرابط.');
                }

                // رابط التحميل المباشر الحقيقي
                const finalDownloadUrl = data.url || (data.picker ? data.picker[0].url : '#');

                // عرض الصورة المصغرة والعنوان
                document.getElementById('thumbnailImg').src = data.thumbnail || 'https://via.placeholder.com/640x360?text=No+Image';
                document.getElementById('videoTitle').textContent = data.filename || 'فيديو بدون عنوان';
                
                // ربط زر التحميل برابط التنزيل المباشر
                document.getElementById('downloadLink').href = finalDownloadUrl;

                statusMsg.classList.add('hidden');
                resultSection.classList.remove('hidden');

            } catch (error) {
                statusMsg.classList.remove('hidden');
                statusMsg.className = "text-xs text-center text-red-400 p-2 bg-red-500/10 rounded-lg";
                statusMsg.textContent = "عذراً، فشل جلب الرابط. تأكد من أن الرابط مدعوم وصحيح.";
            } finally {
                fetchBtn.disabled = false;
                fetchBtn.textContent = "جلب الصورة المصغرة وتحميل";
            }
        }
    </script>
</body>
</html>
