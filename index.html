<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة تفادي العقبات | Mortadha Ali</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        body { background-color: #030712; color: #f8fafc; font-family: 'Cairo', sans-serif; overflow: hidden; user-select: none; }
        canvas { background: linear-gradient(to bottom, #030712, #0b1329); display: block; margin: auto; box-shadow: 0 0 30px rgba(59, 130, 246, 0.2); border-radius: 16px; }
    </style>
</head>
<body class="flex flex-col items-center justify-center h-screen m-0">

    <div class="text-center mb-3">
        <h1 class="text-2xl font-black text-blue-500">لعبة الهروب من النيازك 🚀</h1>
        <p class="text-gray-400 text-xs mt-1">حرك سفينتك بالماوس أو الأسهم لتفادي العقبات والنقاط الحمراء!</p>
    </div>

    <div class="relative">
        <canvas id="gameCanvas" width="450" height="600"></canvas>
        
        <!-- شاشة البداية / الخسارة -->
        <div id="menuScreen" class="absolute inset-0 bg-black/80 backdrop-blur-md flex flex-col items-center justify-center rounded-2xl gap-4">
            <h2 id="menuTitle" class="text-3xl font-black text-white">تحدي الفضاء</h2>
            <p id="finalScore" class="text-gray-400 text-sm hidden">نتيجتك: <span>0</span></p>
            <button onclick="startGame()" class="bg-blue-600 hover:bg-blue-500 text-white font-bold px-8 py-3 rounded-xl shadow-lg shadow-blue-600/40 transition">
                ابدأ اللعب الآن
            </button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let gameInterval, scoreInterval;
        let score = 0;
        let isPlaying = false;

        // السفينة
        let player = {
            x: canvas.width / 2 - 20,
            y: canvas.height - 70,
            w: 40,
            h: 40,
            speed: 6,
            dx: 0
        };

        // العقبات (النيازك)
        let obstacles = [];
        let obstacleTimer = 0;

        // التحكم بالكيبورد
        let keys = {};
        window.addEventListener('keydown', (e) => keys[e.key] = true);
        window.addEventListener('keyup', (e) => keys[e.key] = false);

        // التحكم بالماوس أو اللمس
        canvas.addEventListener('mousemove', (e) => {
            if (!isPlaying) return;
            const rect = canvas.getBoundingClientRect();
            player.x = e.clientX - rect.left - player.w / 2;
        });

        function startGame() {
            document.getElementById("menuScreen").classList.add("hidden");
            document.getElementById("finalScore").classList.add("hidden");
            obstacles = [];
            score = 0;
            player.x = canvas.width / 2 - player.w / 2;
            obstacleTimer = 0;
            isPlaying = true;

            gameInterval = setInterval(update, 1000 / 60); // 60 FPS
            scoreInterval = setInterval(() => score++, 1000);
        }

        function gameOver() {
            isPlaying = false;
            clearInterval(gameInterval);
            clearInterval(scoreInterval);

            document.getElementById("menuTitle").textContent = "خسرت يا وحش! 💥";
            let scoreSpan = document.querySelector("#finalScore span");
            scoreSpan.textContent = score;
            document.getElementById("finalScore").classList.remove("hidden");
            document.getElementById("menuScreen").classList.remove("hidden");
        }

        function update() {
            // مسح الشاشة
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // تحريك السفينة بالكيبورد
            if (keys['ArrowRight'] || keys['d']) player.x += player.speed;
            if (keys['ArrowLeft'] || keys['a']) player.x -= player.speed;

            // حدود الشاشة للسفينة
            if (player.x < 0) player.x = 0;
            if (player.x + player.w > canvas.width) player.x = canvas.width - player.w;

            // رسم السفينة (شكل مثلث فخم)
            ctx.fillStyle = "#3b82f6";
            ctx.beginPath();
            ctx.moveTo(player.x + player.w / 2, player.y);
            ctx.lineTo(player.x, player.y + player.h);
            ctx.lineTo(player.x + player.w, player.y + player.h);
            ctx.closePath();
            ctx.fill();

            // توليد العقبات
            obstacleTimer++;
            if (obstacleTimer % 45 === 0) {
                let size = Math.random() * 30 + 20;
                obstacles.push({
                    x: Math.random() * (canvas.width - size),
                    y: -size,
                    w: size,
                    h: size,
                    speed: Math.random() * 3 + 4 + (score / 10) // تزداد السرعة مع الوقت
                });
            }

            // تحديث ورسم العقبات
            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.y += obs.speed;

                // رسم العقبة (نیازك حمراء مدمرة)
                ctx.fillStyle = "#ef4444";
                ctx.beginPath();
                ctx.arc(obs.x + obs.w / 2, obs.y + obs.h / 2, obs.w / 2, 0, Math.PI * 2);
                ctx.fill();

                // فحص الاصطدام
                if (
                    player.x < obs.x + obs.w &&
                    player.x + player.w > obs.x &&
                    player.y < obs.y + obs.h &&
                    player.y + player.h > obs.y
                ) {
                    gameOver();
                }

                // حذف العقبة إذا خرجت من الشاشة
                if (obs.y > canvas.height) {
                    obstacles.splice(i, 1);
                }
            }

            // عرض النقاط على الشاشة أثناء اللعب
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 18px 'Cairo', sans-serif";
            ctx.fillText("النقاط: " + score, 20, 35);
        }
    </script>
</body>
</html>
