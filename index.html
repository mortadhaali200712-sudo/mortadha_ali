<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحميل الفيديوهات | Mortadha Ali</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { darkbase: '#030712', surfacedark: '#0b1329' } } } }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        body { background-color: #030712; color: #f8fafc; font-family: 'Cairo', sans-serif; }
        .glass { background: rgba(11, 19, 41, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between antialiased">

    <!-- Header -->
    <header class="p-6 flex justify-between items-center max-w-4xl mx-auto w-full">
        <h1 class="text-xl font-black tracking-wider">Mortadha <span class="text-blue-500">Ali</span></h1>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col items-center justify-center p-4">
        <div class="text-center max-w-xl mb-8">
            <h2 class="text-3xl md:text-5xl font-black mb-4">تحميل الفيديو بسهولة وسرعة</h2>
            <p class="text-gray-400 text-sm">ألصق رابط الفيديو للتعرف عليه وعرض الصورة المصغرة وتحميله فوراً.</p>
        </div>

        <div class="w-full max-w-lg glass p-6 md:p-8 rounded-3xl shadow-2xl">
            <div class="flex flex-col gap-4">
                <input id="urlInput" type="url" placeholder="ألصق رابط الفيديو هنا (يوتيوب، تيك توك...)" class="w-full bg-black/50 border border-white/10 rounded-2xl px-4 py-4 focus:outline-none focus:border-blue-500 transition text-sm text-white placeholder-gray-500">
                <button onclick="handleProcess()" id="actionBtn" class="w-full bg-blue-600 hover:bg-blue-500 font-bold py-4 rounded-2xl transition shadow-lg shadow-blue-600/20 text-sm text-white">
                    تحليل الفيديو
                </button>
            </div>

            <div id="status" class="mt-4 text-xs font-semibold text-center hidden p-3 rounded-xl bg-white/5"></div>

            <!-- Result Box -->
            <div id="resultBox" class="mt-6 hidden flex-col gap-4 border-t border-white/10 pt-6">
                <div class="relative w-full aspect-video rounded-xl overflow-hidden bg-black shadow-md">
                    <img id="vidThumb" src="" alt="Thumbnail" class="w-full h-full object-cover">
                </div>
                <h3 id="vidTitle" class="font-bold text-sm md:text-base leading-snug line-clamp-2 text-white"></h3>
                
                <button onclick="triggerDownload()" id="downloadTriggerBtn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-emerald-600/20 text-sm flex items-center justify-center gap-2">
                    <span>تحميل الفيديو على الجهاز</span>
                </button>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center p-6 text-gray-600 text-xs">
        © 2026 Mortadha Ali. جميع الحقوق محفوظة.
    </footer>

    <script>
        let directDownloadUrl = "";

        async function handleProcess() {
            const url = document.getElementById('urlInput').value.trim();
            const status = document.getElementById('status');
            const resultBox = document.getElementById('resultBox');
            const btn = document.getElementById('actionBtn');

            if (!url) {
                alert('الرجاء إدخال رابط صالح.');
                return;
            }

            btn.disabled = true;
            btn.textContent = "جاري التعرف على الفيديو...";
            status.className = "mt-4 text-blue-400 text-center text-xs p-3 rounded-xl bg-blue-500/10";
            status.textContent = "جاري الاتصال وجلب الصورة المصغرة والمعلومات...";
            status.classList.remove('hidden');
            resultBox.classList.add('hidden');

            try {
                // استخدام السيرفر الرسمي والموثق لتحليل الرابط
                const response = await fetch('https://co.wukko.me/api/json', {
                    method: 'POST',
                    headers: { 
                        'Accept': 'application/json', 
                        'Content-Type': 'application/json' 
                    },
                    body: JSON.stringify({ 
                        url: url,
                        vQuality: '720',
                        filenamePattern: 'classic'
                    })
                });

                if (!response.ok) throw new Error('فشل الاتصال');

                const data = await response.json();

                if (data.status === 'error' || (!data.url && !data.picker)) {
                    throw new Error('الرابط غير مدعوم');
                }

                directDownloadUrl = data.url || (data.picker ? data.picker[0].url : '');

                document.getElementById('vidThumb').src = data.thumbnail || '';
                document.getElementById('vidTitle').textContent = data.filename || 'فيديو بدون عنوان';

                status.classList.add('hidden');
                resultBox.classList.remove('hidden');
            } catch (err) {
                status.className = "mt-4 text-red-400 text-center text-xs p-3 rounded-xl bg-red-500/10";
                status.textContent = "عذراً، هذا الرابط غير مدعوم حالياً أو حدث خطأ في الشبكة.";
            } finally {
                btn.disabled = false;
                btn.textContent = "تحليل الفيديو";
            }
        }

        function triggerDownload() {
            if (!directDownloadUrl) return;
            
            // فتح رابط التحميل المباشر لتبدأ عملية التنزيل على الجهاز
            const a = document.createElement('a');
            a.href = directDownloadUrl;
            a.target = '_blank';
            a.download = 'video.mp4';
            document.body.appendChild(a);
            a.click();
            a.remove();
        }
    </script>
</body>
</html>
