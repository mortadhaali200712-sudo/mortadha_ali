<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <title>تحميل الفيديوهات المباشر | Mortadha Ali</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        :root { --primary: #3b82f6; --bg: #030712; }
        body { font-family: 'Cairo', sans-serif; background: var(--bg); color: #fff; display: flex; justify-content: center; padding-top: 50px; }
        .box { background: #0b1329; padding: 30px; border-radius: 20px; width: 100%; max-width: 500px; text-align: center; border: 1px solid #1f2937; }
        input { width: 100%; padding: 15px; border-radius: 10px; border: 1px solid #374151; background: #030712; color: #fff; margin-bottom: 15px; box-sizing: border-box; }
        .thumb { width: 100%; border-radius: 10px; margin-bottom: 15px; display: none; }
        .btn { background: var(--primary); color: white; padding: 15px 30px; border: none; border-radius: 10px; cursor: pointer; width: 100%; font-weight: bold; }
        #downloadArea { display: none; margin-top: 20px; }
    </style>
</head>
<body>

<div class="box">
    <h2>تحميل الفيديو المباشر</h2>
    <input type="url" id="urlInput" placeholder="ضع رابط الفيديو هنا (يوتيوب، تيك توك، إلخ)...">
    <button class="btn" onclick="fetchVideo()">معاينة وتحميل</button>

    <div id="downloadArea">
        <img id="thumbImg" class="thumb" src="" alt="Thumbnail">
        <a id="downloadLink" href="#" class="btn" style="background: #10b981; display: inline-block; text-decoration: none;">تنزيل الفيديو الآن</a>
    </div>
</div>

<script>
    async function fetchVideo() {
        const url = document.getElementById('urlInput').value;
        const btn = document.querySelector('.btn');
        const area = document.getElementById('downloadArea');
        
        btn.innerText = "جاري المعالجة...";
        
        // نستخدم API كبالت لجلب رابط التحميل المباشر
        try {
            const res = await fetch('https://co.wukko.me/api/json', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                body: JSON.stringify({ url: url, vQuality: '720' })
            });
            const data = await res.json();
            
            if (data.url) {
                document.getElementById('thumbImg').src = data.thumbnail || "";
                document.getElementById('thumbImg').style.display = "block";
                document.getElementById('downloadLink').href = data.url;
                area.style.display = "block";
                btn.innerText = "معاينة وتحميل";
            } else {
                alert("تعذر جلب الفيديو، تأكد من الرابط.");
            }
        } catch (e) {
            alert("حدث خطأ تقني.");
        }
    }
</script>
</body>
</html>
